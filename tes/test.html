<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <title>Kopi Digital - Pesan Online</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <section class="order-section">
      <h2>☕ Form Pemesanan</h2>
      <p>Isi data berikut untuk memesan minuman favoritmu</p>

      <form class="order-form">
        <label>Nama Lengkap</label>
        <input type="text" placeholder="Masukkan nama" required />

        <label>No WhatsApp</label>
        <input type="tel" placeholder="08xxxxxxxxxx" required />

        <label>Pilih Menu</label>
        <select required>
          <option value="">-- Pilih Kopi --</option>
          <option>Arabica</option>
          <option>Robusta</option>
          <option>Latte</option>
          <option>Cappuccino</option>
          <option>Mocha</option>
        </select>

        <div class="row">
          <div>
            <label>Ukuran</label>
            <select>
              <option>Small</option>
              <option>Large</option>
            </select>
          </div>

          <div>
            <label>Suhu</label>
            <select>
              <option>Hot</option>
              <option>Cold</option>
            </select>
          </div>
        </div>

        <label>Jumlah</label>
        <input type="number" min="1" value="1" />

        <label>Catatan (opsional)</label>
        <textarea placeholder="Contoh: kurang gula"></textarea>

        <button type="submit">Pesan via WhatsApp</button>
      </form>
    </section>
  </body>
</html>
